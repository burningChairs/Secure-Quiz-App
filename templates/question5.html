{% extends "layout.html"%}

{% block title %}Question {{ qnum }}{% endblock %}

{% block content %}
<h1>Question {{ qnum }}</h1>
<p>{{ question }}</p>

<form method="POST">
	<label for="archasaur">Choose your favorite out of the following Archasaurs:</label><br>
	<select name="answer" id="archasaur">
		{% for key, val in options.items() %}
			<option value="{{ key }}">{{ val }}</option>
		{% endfor %}
	</select>
	<br><br>
	<input type="submit" value="Submit">
</form>
{% endblock %}
