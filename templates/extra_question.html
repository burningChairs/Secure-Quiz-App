{% extends "layout.html" %}

{% block content %}
<div class="quiz-container">
  <h2>{{ quiz_name }}</h2>
  <p>Question {{ q_num + 1 }} of {{ total }}</p>
  <p>{{ question.question }}</p>

  <form method="POST" id="extra-question-form-{{ q_num }}" onsubmit="return handleExtraSubmit({{ q_num }});">
    {% for idx, opt in enumerate(question.options) %}
      <div class="option">
        <input type="radio" id="opt{{ idx }}" name="answer" value="{{ idx }}" required>
        <label for="opt{{ idx }}">{{ opt }}</label>
      </div>
    {% endfor %}
    <button type="submit">Submit</button>
  </form>
</div>

<script>
  // Prevent multiple submissions for extra quizzes
  function handleExtraSubmit(questionNum) {
    const form = document.getElementById(`extra-question-form-${questionNum}`);
    let selected = form.answer.value; // get selected answer
    return submitAnswer(`extra_${questionNum}`, selected); // uses submitAnswer() from script.js
  }
</script>
{% endblock %}
