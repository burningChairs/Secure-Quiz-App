{% extends "layout.html" %}

{% block content %}
<div class="cards-container">
  <h2>Archasaur Cards</h2>
  
  <p>Search for an Archasaur:</p>
  <input type="text" id="search-input" placeholder="Type a name..." oninput="filterCards()" />

  <div id="cards-list">
    {% for card in cards %}
      <div class="card">
        <h3>{{ card.name }} (<em>{{ card.scientific }}</em>)</h3>
        <p><strong>Diet:</strong> {{ card.diet }}</p>
        <p><strong>Size:</strong> {{ card.size }}</p>
        <p><strong>Type:</strong> {{ card.type }}</p>
      </div>
    {% endfor %}
  </div>
</div>

<script>
  // Filter cards locally as user types
  function filterCards() {
    const query = document.getElementById('search-input').value.toLowerCase();
    const cards = document.querySelectorAll('#cards-list .card');
    cards.forEach(card => {
      const name = card.querySelector('h3').textContent.toLowerCase();
      card.style.display = name.includes(query) ? 'block' : 'none';
    });
  }
</script>
{% endblock %}
